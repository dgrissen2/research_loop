[project]
name = "research-loop"
version = "1.1.1"
description = "research_loop framework — back-half enforcement scripts and tests"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["framework/shared/tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "unit: fast isolated tests",
    "integration: multi-component / filesystem tests",
    "slow: slower end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
