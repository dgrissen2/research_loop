<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="research_loop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#162a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <!-- loop glyph: infinity loop (Mine B) -->
  <g transform="translate(30,56) scale(1.1)" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 60 C45 38 24 38 24 60 C24 82 45 82 60 60 C75 38 96 38 96 60 C96 82 75 82 60 60 Z"/>
  </g>
  <text x="190" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="76" font-weight="700" fill="#f8fafc">research_loop</text>
  <text x="192" y="206" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" fill="#cbd5e1">Turn a research question into a tested, falsifiable hypothesis loop.</text>
  <text x="192" y="250" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" fill="#94a3b8">Driven by a Claude Code skill + the Plannotator goals workflow.</text>
  <text x="1140" y="300" text-anchor="end" font-family="ui-monospace,monospace" font-size="16" fill="#475569">placeholder — replace with a branded banner</text>
</svg>
